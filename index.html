<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시냅스 아레나</title>
  <meta name="description" content="뉴런과 시냅스를 직접 이어 가며 AI와 뇌과학을 기초부터 배우는 게임">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f3efe7'/%3E%3Cpath d='M8 10 L24 22 M8 22 L24 10' stroke='%235aa9ff' stroke-width='2.4'/%3E%3Ccircle cx='8' cy='10' r='3.4' fill='%23ffd166'/%3E%3Ccircle cx='8' cy='22' r='3.4' fill='%23ffd166'/%3E%3Ccircle cx='24' cy='10' r='3.4' fill='%237ee081'/%3E%3Ccircle cx='24' cy='22' r='3.4' fill='%237ee081'/%3E%3C/svg%3E">
  <script>try { var t = (JSON.parse(localStorage.getItem('synapse-arena:v1') || '{}').settings || {}).theme; if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <link rel="stylesheet" href="css/style.css?v=50">
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="처음 화면으로">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1d2128"/>
        <path d="M7 9 L25 23 M7 23 L25 9" stroke="#5aa9ff" stroke-width="2.2"/>
        <circle cx="7" cy="9" r="3.6" fill="#ffd166"/><circle cx="7" cy="23" r="3.6" fill="#ffd166"/>
        <circle cx="25" cy="9" r="3.6" fill="#7ee081"/><circle cx="25" cy="23" r="3.6" fill="#7ee081"/>
      </svg>
      <span>시냅스 아레나</span><small>SYNAPSE ARENA</small>
    </button>
    <nav class="nav" aria-label="주 메뉴">
      <button data-go="home">AI 배우기</button>
      <button data-go="lab">연구실</button>
      <button data-go="versus">대결</button>
      <button data-go="notes">개념 노트</button>
    </nav>
    <button class="icon-btn theme-btn" id="btnTheme" aria-label="화이트 모드 / 블랙 모드 바꾸기" title="화이트 / 블랙 모드">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span id="themeLabel">블랙</span>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="설정">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span>설정</span>
    </button>
  </header>

  <main>
    <!-- 실험 목록 -->
    <section class="view" id="view-home"></section>

    <!-- 실험/연구실 플레이 화면 (같은 틀을 함께 쓴다) -->
    <section class="view hidden" id="view-play">
      <div class="play-head">
        <button class="btn sm ghost" id="btnBack">← <span id="backLabel">목록</span></button>
        <h2 id="playTitle">실험</h2>
        <div class="goal" id="playGoal"></div>
        <div class="lab-bar hidden" id="labBar"></div>
      </div>
      <div class="play-grid">
        <div class="panel">
          <div class="panel-title">
            <h3><span id="brainTitle">뇌</span> <span class="chip" id="brainCount">시냅스 0</span></h3>
            <div class="tools">
              <button class="btn sm" id="btnAddHidden" title="숨은 뉴런 추가 (빈 곳 더블클릭)">+ 숨은 뉴런</button>
              <button class="btn sm" id="btnUndo" title="되돌리기 (Ctrl+Z)">↶</button>
              <button class="btn sm" id="btnRedo" title="다시 하기 (Ctrl+Y)">↷</button>
              <button class="btn sm danger" id="btnClear" title="뇌 비우기">비우기</button>
            </div>
          </div>
          <div class="canvas-wrap" id="brainWrap"><canvas class="brain" id="brainCanvas" width="480" height="420" aria-label="뇌 편집기"></canvas></div>
          <div class="vision-left hidden" id="visionLeft"></div>
          <div class="inspector" id="inspector"></div>
        </div>
        <div class="panel">
          <div class="canvas-wrap" id="arenaWrap">
            <canvas class="arena" id="arenaCanvas" width="900" height="600" aria-label="실험 아레나"></canvas>
            <div class="hud" id="hud"></div>
          </div>
          <div class="logic-panel hidden" id="logicPanel"></div>
          <div class="controls" id="arenaControls">
            <button class="btn primary" id="btnRun">▶ 실행</button>
            <button class="btn" id="btnReset" title="처음으로 (R)">↺ 처음으로</button>
            <div class="seg" id="speedSeg" role="group" aria-label="배속">
              <button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button>
            </div>
            <span class="spacer"></span>
            <label class="toggle"><input type="checkbox" id="chkSense"> 감각 범위</label>
            <label class="toggle"><input type="checkbox" id="chkTrail" checked> 지나간 길</label>
          </div>
          <div class="brief" id="brief"></div>
        </div>
      </div>
    </section>

    <section class="view hidden" id="view-versus"></section>
    <section class="view hidden" id="view-notes"></section>
  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <div id="tourRoot"></div>

  <script src="js/backdrop.js?v=50"></script>
  <script src="js/sim.js?v=50"></script>
  <script src="js/content.js?v=50"></script>
  <script src="js/audio.js?v=50"></script>
  <script src="js/arena-view.js?v=50"></script>
  <script src="js/brain-editor.js?v=50"></script>
  <script src="js/app.js?v=50"></script>
</body>
</html>
